{% extends "base.html" %}

{% block title %}首页 - 图片管理系统{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <div class="card shadow">
                <div class="card-body p-5">
                    <i class="bi bi-images text-primary" style="font-size: 5rem;"></i>
                    <h1 class="display-4 mt-4">欢迎使用图片管理系统</h1>
                    <p class="lead text-muted mt-3">
                        一个基于 Flask + MySQL 构建的现代化图片管理平台
                    </p>
                    
                    {% if current_user.is_authenticated %}
                        <div class="alert alert-success mt-4">
                            <i class="bi bi-check-circle-fill"></i>
                            您已登录，欢迎回来，<strong>{{ current_user.username }}</strong>！
                        </div>
                        <div class="mt-4 d-flex justify-content-center gap-3 flex-wrap">
                            <a href="{{ url_for('image.gallery') }}" class="btn btn-primary btn-lg">
                                <i class="bi bi-images"></i> 我的图片库
                            </a>
                            <a href="{{ url_for('image.search') }}" class="btn btn-info btn-lg text-white">
                                <i class="bi bi-search"></i> 搜索
                            </a>
                            <a href="{{ url_for('agent.chat') }}" class="btn btn-warning btn-lg text-white">
                                <i class="bi bi-robot"></i> 智能助手
                            </a>
                            <a href="{{ url_for('image.upload') }}" class="btn btn-success btn-lg">
                                <i class="bi bi-cloud-upload"></i> 上传图片
                            </a>
                        </div>
                    {% else %}
                        <div class="mt-4">
                            <a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-lg me-2">
                                <i class="bi bi-person-plus"></i> 立即注册
                            </a>
                            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right"></i> 登录
                            </a>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
