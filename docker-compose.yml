services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-photomanager_pass}
      - DB_NAME=photomanager
      # Pass API keys from host environment or .env file
      - API_KEY=${API_KEY}
      - AMAP_KEY=${AMAP_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - SIGLIP_MODEL_NAME=${SIGLIP_MODEL_NAME:-google/siglip-base-patch16-224}
      - SIGLIP_DEVICE=${SIGLIP_DEVICE:-auto}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploads
      - ./app/static/uploads:/app/app/static/uploads
    restart: always

  db:
    image: mysql:8.0
    # Use native password plugin for compatibility
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-photomanager_pass}
      - MYSQL_DATABASE=photomanager
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306" # Why 3307? To avoid conflicts with local MySQL installations
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: always

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    restart: always

volumes:
  db_data:
  etcd_data:
  minio_data:
  milvus_data:
